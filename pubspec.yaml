name: gem_ui
description: >
  GEM design system — reusable, app-versionable UI components for chat and
  social applications. One import, one theme call, zero config.
version: 1.0.1
repository: https://github.com/NgoTaiCo/gem_ui

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # Layout / sizing
  flutter_screenutil: ^5.7.0
  # Icons
  lucide_icons_flutter: ^3.1.4
  # Images
  extended_image: ^8.2.0
  # QR codes (DsQrSheet)
  qr_flutter: ^4.0.0
  # Internationalisation utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
